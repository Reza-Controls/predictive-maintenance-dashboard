<svg width="680" height="484" viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="484" fill="#ffffff"/>

  <!-- PLC simulator -->
  <rect x="220" y="40" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="60" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">PLC simulator</text>
  <text x="340" y="78" font-size="12" fill="#185FA5" text-anchor="middle">Modbus TCP, port 5020</text>

  <line x1="340" y1="96" x2="340" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Modbus client -->
  <rect x="210" y="156" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="176" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Modbus client</text>
  <text x="340" y="194" font-size="12" fill="#0F6E56" text-anchor="middle">Poll + z-score detection</text>

  <line x1="340" y1="212" x2="340" y2="272" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SQLite -->
  <rect x="240" y="272" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="292" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">sensor_data.db</text>
  <text x="340" y="310" font-size="12" fill="#444441" text-anchor="middle">SQLite storage</text>

  <line x1="300" y1="328" x2="190" y2="388" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="328" x2="490" y2="388" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="50" y="388" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="190" y="408" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">Dashboard</text>
  <text x="190" y="426" font-size="12" fill="#534AB7" text-anchor="middle">Streamlit, live view</text>

  <!-- ML detector v2 -->
  <rect x="350" y="388" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="490" y="408" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">ML detector (v2)</text>
  <text x="490" y="426" font-size="12" fill="#993C1D" text-anchor="middle">Isolation Forest compare</text>
</svg>
